# Builds our patched Cal.com image and pushes it to ghcr.io/yayforms/cal.
#
# Why this fork exists: gaxios retries neither PATCH nor 403, so a transient Google
# 403 rateLimitExceeded on the PATCH that follows event insert is never retried and the booking
# silently loses its Meet link (upstream calcom/cal.diy#28834, open; five fix PRs closed unmerged).
# Upstream self-host is frozen at v6.2.0 — Cal.com went closed source on 2026-04-14 — so there is
# no released version to upgrade to instead.
#
# Manual trigger only: this takes the better part of an hour and nothing here changes per push.
name: build-yay

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v6.2.0-yay.1)"
        required: true
        default: "v6.2.0-yay.1"
      webapp_url:
        description: "NEXT_PUBLIC_WEBAPP_URL baked into the build"
        required: true
        default: "https://calendar.yayforms.com"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The Cal.com build needs more disk than a default runner leaves free; these preinstalled
      # toolchains are dead weight here and reclaim well over 20GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/yayforms/cal:${{ inputs.tag }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ inputs.webapp_url }}
            MAX_OLD_SPACE_SIZE=6144
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            NEXTAUTH_SECRET=build-only-secret
            CALENDSO_ENCRYPTION_KEY=build-only-secret
            CALCOM_TELEMETRY_DISABLED=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the patch is in the image
        run: |
          # Cheap guard against publishing an unpatched build: the compiled bundle must carry the
          # marker string from our retry filter.
          docker create --name check ghcr.io/yayforms/cal:${{ inputs.tag }}
          docker cp check:/calcom/apps/web/.next/server ./server-chunks
          if grep -rq "userRateLimitExceeded" ./server-chunks; then
            echo "✓ patch present in built bundle"
          else
            echo "✗ patch NOT found in built bundle" && exit 1
          fi
